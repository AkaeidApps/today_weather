name: aether_weather
description: "ATMOS — Ultimate Smart Weather."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.11.1
  geolocator: ^14.0.1
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  permission_handler: ^13.0.2
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-300.ttf
          weight: 300
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
